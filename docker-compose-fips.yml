# LaunchDarkly FIPS relay build (native Go GOFIPS140).
# Use with the base compose file:
#
#   docker compose -f docker-compose.yml -f docker-compose-fips.yml up -d --build

services:
  relay-proxy:
    # Own tag, so the local build does not overwrite the upstream image the base file pulls.
    image: ld-relay-lab:fips-hardened
    build:
      context: ./relay-proxy
      dockerfile: Dockerfile.fips
      args:
        LD_RELAY_VERSION: ${LD_RELAY_VERSION:-9.0.0-rc.6}
        GOFIPS140: ${GOFIPS140:-v1.0.0}
