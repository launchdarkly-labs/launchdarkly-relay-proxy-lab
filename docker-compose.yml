# LaunchDarkly Relay Proxy Enterprise Demo - Docker Compose Configuration
#
# This configuration defines a 9-container microservices architecture:
# 1. dashboard - Static web UI with embedded JavaScript Client SDK (Nginx)
# 2. api-service - API gateway for status checks and operations
# 3. app (node-app-dev) - Node.js SDK demonstration
# 4. relay-proxy - LaunchDarkly Relay Proxy
# 5. redis - Persistent data store
# 6. php (php-app-dev) - PHP SDK demonstration
# 7. python (python-app-dev) - Python SDK demonstration
# 8. squid-proxy - HTTP proxy for relay-proxy connection management
# 9. data-system - Python SDK data system builder (Relay with LaunchDarkly fallback)

services:
  # ============================================================================
  # Dashboard Service
  # ============================================================================
  # Purpose: Serves the static web UI for monitoring and demonstration
  # Port: 8000
  # Dependencies: None (connects to services via browser/client-side)
  # Health Check: HTTP GET to root endpoint
  dashboard:
    container_name: dashboard
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    ports:
      - "${DASHBOARD_PORT:-8000}:8000"  # External:Internal - Web UI access
    # Environment Variables:
    # - LAUNCHDARKLY_CLIENT_SIDE_ID: Client-side ID for JavaScript SDK
    # - DASHBOARD_PORT: Dashboard port for template substitution
    # - API_SERVICE_PORT: API service port for template substitution
    # - NODE_SERVICE_PORT: Node service port for template substitution
    # - PHP_SERVICE_PORT: PHP service port for template substitution
    # - PYTHON_SERVICE_PORT: Python service port for template substitution
    # - DATA_SYSTEM_PORT: Data system service port for template substitution
    # - SQUID_PROXY_PORT: Squid proxy port for template substitution
    environment:
      - LAUNCHDARKLY_CLIENT_SIDE_ID=${LAUNCHDARKLY_CLIENT_SIDE_ID}
      - DASHBOARD_PORT=${DASHBOARD_PORT:-8000}
      - API_SERVICE_PORT=${API_SERVICE_PORT:-4000}
      - NODE_SERVICE_PORT=${NODE_SERVICE_PORT:-3000}
      - PHP_SERVICE_PORT=${PHP_SERVICE_PORT:-8080}
      - PYTHON_SERVICE_PORT=${PYTHON_SERVICE_PORT:-5000}
      - DATA_SYSTEM_PORT=${DATA_SYSTEM_PORT:-5001}
      - SQUID_PROXY_PORT=${SQUID_PROXY_PORT:-3128}
    networks:
      launchdarkly-network:
        ipv4_address: 172.18.0.10
    # No service dependencies - dashboard is a static site that connects
    # to api-service, node-app-dev, and php-app-dev via client-side JavaScript.
    # This allows the dashboard to remain available even if backend services restart.
    # Health Check: Verifies Nginx is serving content
    # Runs every 10 seconds, times out after 3 seconds, retries 3 times
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ============================================================================
  # API Service
  # ============================================================================
  # Purpose: Centralized API gateway for status checks and cross-service operations
  # Port: 4000
  # Dependencies: relay-proxy, redis
  # Health Check: HTTP GET to /health endpoint
  api-service:
    container_name: api-service
    build:
      context: ./api-service
      dockerfile: Dockerfile
    ports:
      - "${API_SERVICE_PORT:-4000}:4000"  # External:Internal - API endpoints
    # Environment Variables:
    # - PORT: HTTP server port (default: 4000)
    # - RELAY_PROXY_URL: URL for relay proxy status checks
    # - NODE_APP_URL: URL for Node.js app status checks
    # - PHP_APP_URL: URL for PHP app status checks
    # - PYTHON_APP_URL: URL for Python app status checks
    environment:
      - PORT=${API_SERVICE_PORT:-4000}
      - RELAY_PROXY_URL=http://relay-proxy:8030
      - NODE_APP_URL=http://node-app-dev:${NODE_SERVICE_PORT:-3000}
      - PHP_APP_URL=http://php-app-dev:80
      - PYTHON_APP_URL=http://python-app-dev:${PYTHON_SERVICE_PORT:-5000}
      - DATA_SYSTEM_APP_URL=http://data-system-app:${DATA_SYSTEM_PORT:-5001}
      - LAUNCHDARKLY_SDK_KEY=${LAUNCHDARKLY_SDK_KEY}
      - LAUNCHDARKLY_CLIENT_SIDE_ID=${LAUNCHDARKLY_CLIENT_SIDE_ID:-}
      - REDIS_PREFIX=${REDIS_PREFIX:-}
    # Volume Mounts:
    # - Docker socket: Required for executing Docker commands (logs, stats, container control)
    #   Mounted read-write to allow container inspection and control
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # User: root required to access Docker socket
    user: root
    networks:
      launchdarkly-network:
        ipv4_address: 172.18.0.20
    # Service Dependencies:
    # - relay-proxy: API service checks relay proxy status
    # - redis: API service checks Redis connectivity
    depends_on:
      - relay-proxy
      - redis
    # Health Check: Verifies API service is responding
    # Runs every 10 seconds, times out after 3 seconds, retries 3 times
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ============================================================================
  # Node.js Application (SDK Demonstration)
  # ============================================================================
  # Purpose: Demonstrates LaunchDarkly Node.js SDK in Relay Proxy mode
  # Port: 3000
  # Dependencies: relay-proxy
  # SDK Mode: Relay Proxy (all traffic through relay proxy)
  app:
    container_name: node-app-dev
    build:
      context: ./node-service
      dockerfile: Dockerfile
    ports:
      - "${NODE_SERVICE_PORT:-3000}:3000"  # External:Internal - SDK demonstration endpoints
    # Environment Variables:
    # - PORT: HTTP server port (default: 3000)
    # - LAUNCHDARKLY_SDK_KEY: LaunchDarkly SDK key (from .env file)
    # - RELAY_PROXY_URL: URL for SDK to connect to relay proxy
    # - DASHBOARD_PORT: Dashboard port for CORS configuration
    environment:
      - PORT=${NODE_SERVICE_PORT:-3000}
      - LAUNCHDARKLY_SDK_KEY=${LAUNCHDARKLY_SDK_KEY}
      - RELAY_PROXY_URL=http://relay-proxy:8030
      - DASHBOARD_PORT=${DASHBOARD_PORT:-8000}
    # Volume Mounts:
    # - Docker socket: Required for log retrieval operations
    #   Note: This is legacy from when app served dashboard; may be removed in future
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # User: root required to access Docker socket
    user: root
    networks:
      launchdarkly-network:
        ipv4_address: 172.18.0.30
    # Service Dependencies:
    # - relay-proxy: Node.js SDK connects to relay proxy for all operations
    depends_on:
      - relay-proxy

  # ============================================================================
  # LaunchDarkly Relay Proxy
  # ============================================================================
  # Purpose: Caches feature flags and forwards events to LaunchDarkly
  # Port: 8030
  # Dependencies: redis (with health check)
  # Health Check: None (relies on Redis health check)
  relay-proxy:
    container_name: relay-proxy
    image: launchdarkly/ld-relay:${LD_RELAY_VERSION:-9.0.0-rc.6}
    ports:
      - "8030:8030"  # External:Internal - Relay proxy API
    # Environment Variables:
    # - AUTO_CONFIG_KEY: Relay proxy configuration key (from .env file)
    # - PORT: HTTP server port (default: 8030)
    # - USE_EVENTS: Enable event forwarding to LaunchDarkly (true)
    # - USE_REDIS: Enable Redis as persistent data store (1 = enabled)
    # - REDIS_URL: Connection string for Redis
    # - ENV_DATASTORE_PREFIX: Prefix for Redis keys (includes environment ID)
    # - ENV_ALLOWED_ORIGIN: comma-delimited CORS allowlist. Without it the relay reflects
    #   whatever Origin the browser sends.
    environment:
      - AUTO_CONFIG_KEY=${RELAY_PROXY_CONFIG_KEY}
      - PORT=8030
      - USE_EVENTS=true
      - USE_REDIS=1
      - REDIS_URL=redis://redis:6379
      - ENV_DATASTORE_PREFIX=ld-flags-$$CID
      - ENV_ALLOWED_ORIGIN=http://localhost:${DASHBOARD_PORT:-8000},http://localhost:${NODE_SERVICE_PORT:-3000}
      - HTTP_PROXY=http://172.18.0.80:3128
      - HTTPS_PROXY=http://172.18.0.80:3128
      - NO_PROXY=redis,172.18.0.50,localhost,127.0.0.1
    networks:
      launchdarkly-network:
        ipv4_address: 172.18.0.40
    # Service Dependencies:
    # - redis: Relay proxy requires Redis for persistent flag storage
    #   Waits for Redis to be healthy before starting (condition: service_healthy)
    # - squid-proxy: Relay proxy routes internet traffic through Squid proxy
    #   Waits for squid-proxy to be healthy before starting (condition: service_healthy)
    depends_on:
      redis:
        condition: service_healthy
      squid-proxy:
        condition: service_healthy

  # ============================================================================
  # Redis Data Store
  # ============================================================================
  # Purpose: Persistent storage for feature flags and application data
  # Port: 6379
  # Dependencies: None
  # Health Check: Redis PING command
  redis:
    container_name: redis
    image: redis:7-alpine
    # Command: Enable AOF (Append-Only File) persistence
    # This ensures data survives container restarts
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"  # External:Internal - Redis protocol
    # Volume Mounts:
    # - redis-data: Persistent volume for Redis data files
    #   Stores AOF file and RDB snapshots
    #   Data survives container removal and recreation
    volumes:
      - redis-data:/data
    networks:
      launchdarkly-network:
        ipv4_address: 172.18.0.50
    # Health Check: Verifies Redis is accepting connections
    # Runs every 5 seconds, times out after 3 seconds, retries 5 times
    # Other services wait for this health check before starting
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================================
  # PHP Application (SDK Demonstration)
  # ============================================================================
  # Purpose: Demonstrates LaunchDarkly PHP SDK in Daemon mode
  # Port: 8080 (mapped to internal port 80)
  # Dependencies: redis (with health check)
  # SDK Mode: Daemon (reads flags from Redis, sends events via relay proxy)
  php:
    container_name: php-app-dev
    build:
      context: ./php
      dockerfile: Dockerfile
    ports:
      - "${PHP_SERVICE_PORT:-8080}:80"  # External:Internal - PHP application (Nginx on port 80)
    # Environment Variables:
    # - LAUNCHDARKLY_SDK_KEY: LaunchDarkly SDK key (from .env file)
    # - REDIS_HOST: Redis hostname for daemon mode
    # - REDIS_PORT: Redis port for daemon mode
    # - REDIS_PREFIX: Redis key prefix (must match relay proxy environment ID)
    # - RELAY_PROXY_URL: URL for sending analytics events
    # - DASHBOARD_PORT: Dashboard port for CORS configuration
    environment:
      - LAUNCHDARKLY_SDK_KEY=${LAUNCHDARKLY_SDK_KEY}
      - LAUNCHDARKLY_CLIENT_SIDE_ID=${LAUNCHDARKLY_CLIENT_SIDE_ID:-}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PREFIX=${REDIS_PREFIX:-}
      - RELAY_PROXY_URL=http://relay-proxy:8030
      - DASHBOARD_PORT=${DASHBOARD_PORT:-8000}
    networks:
      launchdarkly-network:
        ipv4_address: 172.18.0.60
    # Service Dependencies:
    # - redis: PHP SDK reads feature flags directly from Redis
    #   Waits for Redis to be healthy before starting (condition: service_healthy)
    depends_on:
      redis:
        condition: service_healthy

  # ============================================================================
  # Python Application (SDK Demonstration)
  # ============================================================================
  # Purpose: Demonstrates LaunchDarkly Python server-side SDK in Default mode
  # Port: 5000
  # Dependencies: None (connects directly to LaunchDarkly)
  # SDK Mode: Default (direct connection to LaunchDarkly for streaming and events)
  python:
    container_name: python-app-dev
    build:
      context: ./python
      dockerfile: Dockerfile
    ports:
      - "${PYTHON_SERVICE_PORT:-5000}:5000"  # External:Internal - Python application endpoints
    # Environment Variables:
    # - LAUNCHDARKLY_SDK_KEY: LaunchDarkly SDK key (from .env file)
    # - PORT: HTTP server port (default: 5000)
    # - DASHBOARD_PORT: Dashboard port for CORS configuration
    # - NODE_SERVICE_PORT: Node service port for CORS configuration
    environment:
      - LAUNCHDARKLY_SDK_KEY=${LAUNCHDARKLY_SDK_KEY}
      - PORT=${PYTHON_SERVICE_PORT:-5000}
      - DASHBOARD_PORT=${DASHBOARD_PORT:-8000}
      - NODE_SERVICE_PORT=${NODE_SERVICE_PORT:-3000}
    networks:
      launchdarkly-network:
        ipv4_address: 172.18.0.70
    # Health Check: Verifies Python service is responding
    # Runs every 10 seconds, times out after 3 seconds, retries 3 times
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ============================================================================
  # Squid Proxy Service
  # ============================================================================
  # Purpose: HTTP/HTTPS proxy for relay proxy internet traffic control
  # Technology: Squid proxy server
  # Port: 3128
  # Dependencies: None
  # Health Check: Netcat connection test on port 3128
  squid-proxy:
    container_name: squid-proxy
    build:
      context: ./squid-proxy
      dockerfile: Dockerfile
    ports:
      - "${SQUID_PROXY_PORT:-3128}:3128"  # External:Internal - HTTP proxy port
    networks:
      launchdarkly-network:
        ipv4_address: 172.18.0.80
    # Health Check: Verifies proxy is accepting connections
    # Runs every 5 seconds, times out after 3 seconds, retries 3 times
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "3128"]
      interval: 5s
      timeout: 3s
      retries: 3

  # ============================================================================
  # Data System Application (SDK fallback demonstration)
  # ============================================================================
  # Purpose: Demonstrates Python SDK datasystem.custom() with Relay-first
  #          streaming and automatic fallback to LaunchDarkly
  # Port: 5001
  # SDK Mode: Custom data system (Relay streaming → LD streaming → LD polling)
  data-system:
    container_name: data-system-app
    build:
      context: ./data-system
      dockerfile: Dockerfile
    ports:
      - "${DATA_SYSTEM_PORT:-5001}:5001"
    environment:
      - LAUNCHDARKLY_SDK_KEY=${LAUNCHDARKLY_SDK_KEY}
      - PORT=${DATA_SYSTEM_PORT:-5001}
      - DASHBOARD_PORT=${DASHBOARD_PORT:-8000}
      - NODE_SERVICE_PORT=${NODE_SERVICE_PORT:-3000}
      - RELAY_URI=http://relay-proxy:8030
    networks:
      launchdarkly-network:
        ipv4_address: 172.18.0.100
    depends_on:
      - relay-proxy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 10s
      timeout: 3s
      retries: 3

# ==============================================================================
# Networks
# ==============================================================================
# Custom bridge network for inter-container communication
# All containers communicate over this network using container names as hostnames
networks:
  launchdarkly-network:
    # Unprefixed, so the documented `docker run --network launchdarkly-network` probe
    # commands resolve. Compose would otherwise prepend the project name.
    name: launchdarkly-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1

# ==============================================================================
# Volumes
# ==============================================================================
# Persistent volumes for data storage
volumes:
  # redis-data: Stores Redis AOF and RDB files
  # Data persists across container restarts and recreations
  # Located in Docker's volume directory (typically /var/lib/docker/volumes/)
  redis-data:
    driver: local
